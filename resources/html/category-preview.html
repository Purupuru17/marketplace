<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview — Kategori (Design Standard)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
      },
    },
  };
</script>
<style>
  .no-scrollbar::-webkit-scrollbar{display:none}
  .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
  body{font-family:'Plus Jakarta Sans',sans-serif}
</style>
</head>
<body class="bg-gray-200">

<div class="max-w-[420px] mx-auto min-h-screen bg-gray-50 shadow-2xl relative pb-20">

  <header class="sticky top-0 z-30 bg-white border-b border-gray-100 px-4 py-3">
    <h1 class="font-bold text-[15px] text-gray-900 mb-2.5">Kategori</h1>
    <!-- Tap search bar -> langsung ke Search & Filter (bukan search terpisah) -->
    <button class="w-full flex items-center gap-2 bg-gray-100 rounded-full px-3.5 py-2.5">
      <svg class="w-4 h-4 text-gray-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m0 0a7.5 7.5 0 10-10.6 0 7.5 7.5 0 0010.6 0z"/></svg>
      <span class="text-sm text-gray-400">Cari produk, toko, atau kategori...</span>
    </button>
  </header>

  <main class="px-4">

    <!-- Kategori unggulan / sering dicari -->
    <section class="mt-4">
      <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wide mb-2.5">Sering Dicari</h2>
      <div class="flex gap-2.5 overflow-x-auto no-scrollbar">
        <button class="shrink-0 flex flex-col items-center gap-2">
          <div class="w-16 h-16 rounded-2xl bg-emerald-50 flex items-center justify-center text-2xl">🍚</div>
          <span class="text-[11px] font-medium text-gray-700">Sembako</span>
        </button>
        <button class="shrink-0 flex flex-col items-center gap-2">
          <div class="w-16 h-16 rounded-2xl bg-emerald-50 flex items-center justify-center text-2xl">🥬</div>
          <span class="text-[11px] font-medium text-gray-700">Sayur & Buah</span>
        </button>
        <button class="shrink-0 flex flex-col items-center gap-2">
          <div class="w-16 h-16 rounded-2xl bg-emerald-50 flex items-center justify-center text-2xl">🍢</div>
          <span class="text-[11px] font-medium text-gray-700">Jajanan</span>
        </button>
        <button class="shrink-0 flex flex-col items-center gap-2">
          <div class="w-16 h-16 rounded-2xl bg-emerald-50 flex items-center justify-center text-2xl">🧴</div>
          <span class="text-[11px] font-medium text-gray-700">Kebutuhan Rumah</span>
        </button>
      </div>
    </section>

    <!-- Semua kategori: grid ikon+nama, tap = ke Search&Filter dgn category preset -->
    <section class="mt-6">
      <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wide mb-2.5">Semua Kategori</h2>
      <div class="grid grid-cols-4 gap-y-4">
        <button class="flex flex-col items-center gap-1.5">
          <div class="w-14 h-14 rounded-2xl bg-white border border-gray-100 flex items-center justify-center text-xl">🍚</div>
          <span class="text-[11px] text-gray-700 text-center leading-tight">Sembako</span>
        </button>
        <button class="flex flex-col items-center gap-1.5">
          <div class="w-14 h-14 rounded-2xl bg-white border border-gray-100 flex items-center justify-center text-xl">🥬</div>
          <span class="text-[11px] text-gray-700 text-center leading-tight">Sayur & Buah</span>
        </button>
        <button class="flex flex-col items-center gap-1.5">
          <div class="w-14 h-14 rounded-2xl bg-white border border-gray-100 flex items-center justify-center text-xl">🥩</div>
          <span class="text-[11px] text-gray-700 text-center leading-tight">Daging & Ikan</span>
        </button>
        <button class="flex flex-col items-center gap-1.5">
          <div class="w-14 h-14 rounded-2xl bg-white border border-gray-100 flex items-center justify-center text-xl">🍢</div>
          <span class="text-[11px] text-gray-700 text-center leading-tight">Jajanan</span>
        </button>
        <button class="flex flex-col items-center gap-1.5">
          <div class="w-14 h-14 rounded-2xl bg-white border border-gray-100 flex items-center justify-center text-xl">🧴</div>
          <span class="text-[11px] text-gray-700 text-center leading-tight">Kebutuhan Rumah</span>
        </button>
        <button class="flex flex-col items-center gap-1.5">
          <div class="w-14 h-14 rounded-2xl bg-white border border-gray-100 flex items-center justify-center text-xl">🧼</div>
          <span class="text-[11px] text-gray-700 text-center leading-tight">Kebersihan</span>
        </button>
        <button class="flex flex-col items-center gap-1.5">
          <div class="w-14 h-14 rounded-2xl bg-white border border-gray-100 flex items-center justify-center text-xl">👶</div>
          <span class="text-[11px] text-gray-700 text-center leading-tight">Ibu & Bayi</span>
        </button>
        <button class="flex flex-col items-center gap-1.5">
          <div class="w-14 h-14 rounded-2xl bg-white border border-gray-100 flex items-center justify-center text-xl">🐾</div>
          <span class="text-[11px] text-gray-700 text-center leading-tight">Hewan Peliharaan</span>
        </button>
        <button class="flex flex-col items-center gap-1.5">
          <div class="w-14 h-14 rounded-2xl bg-white border border-gray-100 flex items-center justify-center text-xl">🎨</div>
          <span class="text-[11px] text-gray-700 text-center leading-tight">Kerajinan</span>
        </button>
        <button class="flex flex-col items-center gap-1.5">
          <div class="w-14 h-14 rounded-2xl bg-white border border-gray-100 flex items-center justify-center text-xl">🔧</div>
          <span class="text-[11px] text-gray-700 text-center leading-tight">Perkakas</span>
        </button>
        <button class="flex flex-col items-center gap-1.5">
          <div class="w-14 h-14 rounded-2xl bg-white border border-gray-100 flex items-center justify-center text-xl">🌾</div>
          <span class="text-[11px] text-gray-700 text-center leading-tight">Hasil Tani</span>
        </button>
        <button class="flex flex-col items-center gap-1.5">
          <div class="w-14 h-14 rounded-2xl bg-gray-50 border border-gray-100 flex items-center justify-center text-gray-400">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h7"/></svg>
          </div>
          <span class="text-[11px] text-gray-500 text-center leading-tight">Lainnya</span>
        </button>
      </div>
    </section>

    <!-- Jelajahi Toko - alternatif entry point selain by kategori -->
    <section class="mt-6 bg-white rounded-xl border border-gray-100 p-3.5 flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-emerald-50 flex items-center justify-center shrink-0">
        <svg class="w-5 h-5 text-emerald-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-[13px] font-semibold text-gray-900">Jelajahi Semua Toko</p>
        <p class="text-[11px] text-gray-500 mt-0.5">Lihat toko terdekat dari lokasimu</p>
      </div>
      <svg class="w-4 h-4 text-gray-300 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
    </section>

  </main>

  <nav class="fixed bottom-0 inset-x-0 max-w-[420px] mx-auto bg-white border-t border-gray-100 flex z-30">
    <a class="flex-1 flex flex-col items-center gap-0.5 py-2.5 text-gray-400">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span class="text-[10px] font-medium">Beranda</span>
    </a>
    <a class="flex-1 flex flex-col items-center gap-0.5 py-2.5 text-emerald-700">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h7"/></svg>
      <span class="text-[10px] font-semibold">Kategori</span>
    </a>
    <a class="flex-1 flex flex-col items-center gap-0.5 py-2.5 text-gray-400">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <span class="text-[10px] font-medium">Pesanan</span>
    </a>
    <a class="flex-1 flex flex-col items-center gap-0.5 py-2.5 text-gray-400">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
      <span class="text-[10px] font-medium">Chat</span>
    </a>
    <a class="flex-1 flex flex-col items-center gap-0.5 py-2.5 text-gray-400">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      <span class="text-[10px] font-medium">Akun</span>
    </a>
  </nav>

</div>

</body>
</html>
