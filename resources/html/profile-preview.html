<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview — Profil/Akun (Design Standard)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
      },
    },
  };
</script>
<style>
  .no-scrollbar::-webkit-scrollbar{display:none}
  .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
  body{font-family:'Plus Jakarta Sans',sans-serif}
</style>
</head>
<body class="bg-gray-200">

<!-- ======================= STATE A: PROFIL / AKUN ======================= -->
<div class="max-w-[420px] mx-auto min-h-screen bg-gray-50 shadow-2xl relative pb-20 mb-6">

  <header class="sticky top-0 z-30 bg-white border-b border-gray-100 px-4 py-3">
    <h1 class="font-bold text-[15px] text-gray-900">Akun Saya</h1>
  </header>

  <main class="px-4">

    <!-- Profile card -->
    <section class="mt-4 bg-white rounded-xl border border-gray-100 p-4 flex items-center gap-3.5">
      <div class="w-14 h-14 rounded-full bg-emerald-100 text-emerald-800 flex items-center justify-center font-bold text-lg shrink-0">P</div>
      <div class="min-w-0 flex-1">
        <p class="text-[15px] font-bold text-gray-900 truncate">Puru Widiarto</p>
        <p class="text-xs text-gray-500 mt-0.5 truncate">+62 812-3456-7890</p>
      </div>
      <button class="w-8 h-8 flex items-center justify-center text-gray-400 shrink-0">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
      </button>
    </section>

    <!-- Ringkasan pesanan -->
    <section class="mt-3 bg-white rounded-xl border border-gray-100 p-3.5">
      <div class="flex items-center justify-between mb-3">
        <p class="text-[13px] font-semibold text-gray-800">Pesanan Saya</p>
        <button class="text-[11px] font-medium text-emerald-700 flex items-center gap-0.5">
          Lihat Semua
          <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
      <div class="grid grid-cols-4 gap-1">
        <button class="flex flex-col items-center gap-1.5">
          <div class="relative w-9 h-9 flex items-center justify-center">
            <svg class="w-6 h-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M3 6l3 1m0 0l2.5 10.5A2 2 0 0010.44 19h6.12a2 2 0 001.94-1.5L21 8H6"/></svg>
            <span class="absolute -top-0.5 -right-0.5 bg-red-600 text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center">1</span>
          </div>
          <span class="text-[10px] text-gray-600">Bayar</span>
        </button>
        <button class="flex flex-col items-center gap-1.5">
          <svg class="w-6 h-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
          <span class="text-[10px] text-gray-600">Diproses</span>
        </button>
        <button class="flex flex-col items-center gap-1.5">
          <svg class="w-6 h-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0zM13 17H7V4H3m4 13V7h11l3 6h-3m-4 4h4m-4-4v4"/></svg>
          <span class="text-[10px] text-gray-600">Dikirim</span>
        </button>
        <button class="flex flex-col items-center gap-1.5">
          <svg class="w-6 h-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span class="text-[10px] text-gray-600">Selesai</span>
        </button>
      </div>
    </section>

    <!-- Menu group 1 -->
    <section class="mt-3 bg-white rounded-xl border border-gray-100 divide-y divide-gray-50">
      <button class="w-full flex items-center gap-3 px-3.5 py-3">
        <svg class="w-4.5 h-4.5 w-[18px] h-[18px] text-gray-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a2 2 0 01-2.828 0l-4.243-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        <span class="flex-1 text-left text-[13px] text-gray-800">Alamat Tersimpan</span>
        <svg class="w-3.5 h-3.5 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
      </button>
      <button class="w-full flex items-center gap-3 px-3.5 py-3">
        <svg class="w-[18px] h-[18px] text-gray-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
        <span class="flex-1 text-left text-[13px] text-gray-800">Produk Favorit</span>
        <svg class="w-3.5 h-3.5 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
      </button>
      <button class="w-full flex items-center gap-3 px-3.5 py-3">
        <svg class="w-[18px] h-[18px] text-gray-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
        <span class="flex-1 text-left text-[13px] text-gray-800">Riwayat Baru Dilihat</span>
        <svg class="w-3.5 h-3.5 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
      </button>
    </section>

    <!-- Menu group 2 -->
    <section class="mt-3 bg-white rounded-xl border border-gray-100 divide-y divide-gray-50">
      <button class="w-full flex items-center gap-3 px-3.5 py-3">
        <svg class="w-[18px] h-[18px] text-gray-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
        <span class="flex-1 text-left text-[13px] text-gray-800">Notifikasi</span>
        <svg class="w-3.5 h-3.5 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
      </button>
      <button class="w-full flex items-center gap-3 px-3.5 py-3">
        <svg class="w-[18px] h-[18px] text-gray-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        <span class="flex-1 text-left text-[13px] text-gray-800">Keamanan Akun</span>
        <svg class="w-3.5 h-3.5 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
      </button>
      <button class="w-full flex items-center gap-3 px-3.5 py-3">
        <svg class="w-[18px] h-[18px] text-gray-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span class="flex-1 text-left text-[13px] text-gray-800">Pusat Bantuan</span>
        <svg class="w-3.5 h-3.5 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
      </button>
      <button class="w-full flex items-center gap-3 px-3.5 py-3">
        <svg class="w-[18px] h-[18px] text-gray-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span class="flex-1 text-left text-[13px] text-gray-800">Tentang Aplikasi</span>
        <span class="text-[11px] text-gray-400">v1.0.0</span>
      </button>
    </section>

    <!-- Menu jadi penjual -->
    <section class="mt-3 bg-gradient-to-br from-emerald-700 to-emerald-800 rounded-xl p-4 flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-white/15 flex items-center justify-center shrink-0">
        <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-[13px] font-bold text-white">Buka Toko di Sini</p>
        <p class="text-[11px] text-emerald-100 mt-0.5">Mulai jualan ke tetangga sekitarmu</p>
      </div>
      <svg class="w-4 h-4 text-white shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
    </section>

    <button class="w-full mt-4 text-xs font-semibold text-red-600 border border-red-200 rounded-lg py-3">Keluar Akun</button>

  </main>

  <nav class="fixed bottom-0 inset-x-0 max-w-[420px] mx-auto bg-white border-t border-gray-100 flex z-30">
    <a class="flex-1 flex flex-col items-center gap-0.5 py-2.5 text-gray-400">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span class="text-[10px] font-medium">Beranda</span>
    </a>
    <a class="flex-1 flex flex-col items-center gap-0.5 py-2.5 text-gray-400">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h7"/></svg>
      <span class="text-[10px] font-medium">Kategori</span>
    </a>
    <a class="flex-1 flex flex-col items-center gap-0.5 py-2.5 text-gray-400">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <span class="text-[10px] font-medium">Pesanan</span>
    </a>
    <a class="flex-1 flex flex-col items-center gap-0.5 py-2.5 text-gray-400">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
      <span class="text-[10px] font-medium">Chat</span>
    </a>
    <a class="flex-1 flex flex-col items-center gap-0.5 py-2.5 text-emerald-700">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      <span class="text-[10px] font-semibold">Akun</span>
    </a>
  </nav>

</div>

<!-- ======================= STATE B: EDIT PROFIL ======================= -->
<div class="max-w-[420px] mx-auto min-h-screen bg-gray-50 shadow-2xl relative pb-6">
  <p class="text-center text-xs text-gray-400 pt-4 pb-2 font-medium">— Contoh: Edit Profil —</p>

  <header class="bg-white border-b border-gray-100 px-4 py-3 flex items-center gap-3">
    <button class="w-8 h-8 flex items-center justify-center shrink-0">
      <svg class="w-5 h-5 text-gray-800" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
    </button>
    <h1 class="font-bold text-[15px] text-gray-900">Edit Profil</h1>
  </header>

  <main class="px-4">
    <div class="flex flex-col items-center py-5">
      <div class="relative">
        <div class="w-20 h-20 rounded-full bg-emerald-100 text-emerald-800 flex items-center justify-center font-bold text-2xl">P</div>
        <button class="absolute bottom-0 right-0 w-7 h-7 bg-emerald-700 rounded-full flex items-center justify-center border-2 border-white">
          <svg class="w-3.5 h-3.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><circle cx="12" cy="13" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="space-y-3.5">
      <div>
        <label class="text-[11px] font-medium text-gray-500">Nama Lengkap</label>
        <input value="Puru Widiarto" class="w-full mt-1 text-sm text-gray-800 border border-gray-200 rounded-lg px-3 py-2.5">
      </div>
      <div>
        <label class="text-[11px] font-medium text-gray-500">Nomor HP</label>
        <div class="flex items-center mt-1 border border-gray-200 rounded-lg px-3 py-2.5">
          <input value="+62 812-3456-7890" disabled class="flex-1 text-sm text-gray-500 bg-transparent">
          <span class="text-[10px] font-medium text-emerald-700">Terverifikasi</span>
        </div>
      </div>
      <div>
        <label class="text-[11px] font-medium text-gray-500">Email</label>
        <input value="puru@example.com" class="w-full mt-1 text-sm text-gray-800 border border-gray-200 rounded-lg px-3 py-2.5">
      </div>
      <div>
        <label class="text-[11px] font-medium text-gray-500">Tanggal Lahir</label>
        <input value="12 Maret 1998" class="w-full mt-1 text-sm text-gray-800 border border-gray-200 rounded-lg px-3 py-2.5">
      </div>
    </div>

    <button class="w-full mt-6 text-sm font-semibold text-white bg-emerald-700 rounded-lg py-3">Simpan Perubahan</button>
  </main>
</div>

</body>
</html>
